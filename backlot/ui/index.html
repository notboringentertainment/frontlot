<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#353b35">
<title>Front Lot</title>
<link rel="preload" href="/ui/vendor/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui/board.css">
</head>
<body class="vault">
<a class="skip-link" href="#library-content">Skip to your films</a>
<header class="bar">
  <a class="maker" href="/" aria-label="Front Lot home">
    <svg class="maker-mark" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="13" cy="13" r="2.5" fill="currentColor"/><circle cx="13" cy="6.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="19.2" cy="15" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="6.8" cy="15" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    <span class="maker-name">Front Lot</span>
  </a>
  <span class="status" id="liveBadge" role="status" aria-live="polite" style="margin-left:auto"><span class="lamp"></span><span id="liveText">Idle</span></span>
</header>
<main class="vault-inner" id="library-content" tabindex="-1">
  <div class="vault-head">
    <h1>Your films</h1>
    <span id="count"></span>
  </div>
  <div class="lib-grid" id="grid"></div>
  <p class="hint" id="empty" role="status" aria-live="polite" hidden>No films yet. When a production starts, it shows up here.</p>
</main>
<script type="module" src="/ui/library.js"></script>
</body>
</html>
