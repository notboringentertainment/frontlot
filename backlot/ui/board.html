<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#353b35">
<title>Front Lot</title>
<link rel="preload" href="/ui/vendor/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui/board.css">
<link rel="stylesheet" href="/ui/vendor/xterm-5.5.0.css">
</head>
<body>
<a class="skip-link" href="#viewer">Skip to the viewer</a>
<div class="table" id="table">
  <div id="app"></div>
  <aside class="log" id="log" aria-label="Log">
    <div class="log-feed" id="log-feed"></div>
    <section class="session" id="session" aria-label="Conversation with Claude">
      <p class="session-state" id="session-state" aria-live="polite"></p>
      <p class="session-note" id="session-note" aria-live="polite" hidden></p>
      <div class="session-feed" id="session-feed" aria-live="polite"></div>
      <div class="session-terminal" id="session-terminal" hidden></div>
      <form class="composer" id="composer">
        <textarea id="composer-text" rows="2" placeholder="Talk to Claude about this film" aria-label="Message to Claude"></textarea>
        <div class="composer-buttons">
          <button type="submit" class="quiet-btn" id="composer-send">Send</button>
          <button type="button" class="quiet-btn" id="composer-stop" hidden>Stop</button>
          <button type="button" class="quiet-btn" id="terminal-toggle" aria-pressed="false">Show terminal</button>
        </div>
      </form>
    </section>
    <details class="log-section log-more log-history" id="history"><summary>History</summary><div id="history-body"></div></details>
    <!-- Stable terminal ownership boundary. render()/SSE never replace this section. -->
    <section class="terminal-shell" id="gate-terminal-shell" aria-labelledby="gate-terminal-heading" hidden>
      <div class="terminal-shell-head">
        <h2 id="gate-terminal-heading">Signing</h2>
        <span class="terminal-state" id="gate-terminal-state" aria-live="polite">Not connected</span>
      </div>
      <p class="terminal-message" id="gate-terminal-message" aria-live="polite">Pick something that needs you to begin.</p>
      <div class="terminal-mount" id="gate-terminal" role="region" aria-label="Signing program"></div>
    </section>
  </aside>
</div>
<div class="modal-bg" id="modal"></div>
<audio id="player"></audio>
<script src="/ui/vendor/xterm-5.5.0.js"></script>
<script src="/ui/vendor/addon-fit-0.10.0.js"></script>
<script type="module" src="/ui/board.js"></script>
</body>
</html>
